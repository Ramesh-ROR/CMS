<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem("slc_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Cases — SLC Case Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
<style>
  .missing-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; background: #FEF3C7; color: #B45309; padding: 2px 8px; border-radius: 6px; margin: 2px 3px 2px 0; }
  .missing-chip i { font-size: 10px; }
  .reg-progress-bar { width: 84px; height: 7px; background: #F3F4F6; border-radius: 20px; overflow: hidden; }
  .reg-progress-bar .fill { height: 100%; background: linear-gradient(90deg, #D97706, #F59E0B); border-radius: 20px; }
  [data-theme="dark"] .missing-chip { background: rgba(217,119,6,.2); color: #FCD34D; }
  [data-theme="dark"] .reg-progress-bar { background: rgba(255,255,255,.08); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Pending Cases" data-ar="القضايا المعلقة">Pending Cases</h1>
      <div class="page-subtitle">All cases that did not complete the registration cycle. Complete required fields to move each case into Live status.</div>
    </div>
    <div class="page-title-actions">
      <button class="btn btn-light border" id="exportBtn"><i class="bi bi-download"></i>Export</button>
    </div>
  </div>

  <!-- KPI strip -->
  <div class="row g-3 mb-2" id="pcKpiRow"></div>

  <div id="aiInsightSlot"></div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="row g-2 align-items-end">
      <div class="col-lg-4 col-md-6">
        <label>Search</label>
        <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Search ref, system no., title, entity...">
      </div>
      <div class="col-lg-2 col-md-3">
        <label>Work Type</label>
        <select class="form-select form-select-sm" id="fWorkType"><option value="">All Work Types</option></select>
      </div>
      <div class="col-lg-2 col-md-3">
        <label>Work Source</label>
        <select class="form-select form-select-sm" id="fWorkSource"><option value="">All Sources</option></select>
      </div>
      <div class="col-lg-2 col-md-3">
        <label>Directorate</label>
        <select class="form-select form-select-sm" id="fDirectorate"><option value="">All Directorates</option></select>
      </div>
      <div class="col-lg-2 col-md-3 d-flex gap-2">
        <button class="btn btn-light border btn-sm w-100" id="fResetBtn"><i class="bi bi-arrow-counterclockwise"></i>Reset</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="pendingCasesTable">
        <thead>
          <tr>
            <th>Case Ref. / System No.</th>
            <th>Case Title</th>
            <th>Work Type</th>
            <th>Case Type</th>
            <th>Work Source</th>
            <th>Opened Date</th>
            <th>Requesting Entity</th>
            <th>Registration Status</th>
            <th>Missing Information</th>
            <th>Assigned User</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pendingCasesTbody"></tbody>
      </table>
    </div>
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-3 border-top">
      <div class="text-muted-soft" id="pcResultCount" style="font-size:12.3px;"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/pending-cases.js"></script>
</body>
</html>
