<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Details — SLC Case Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .rpt-meta-chip { font-size: 11px; font-weight: 700; color: var(--slc-muted); background: #F3F4F6; padding: 3px 10px; border-radius: 20px; }
  [data-theme="dark"] .rpt-meta-chip { background: rgba(255,255,255,.08); color: var(--slc-muted); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" id="rptTitle">Report</h1>
      <div class="page-subtitle" id="rptDesc"></div>
    </div>
    <div class="page-title-actions">
      <span class="rpt-meta-chip" id="rptChartTag"></span>
      <button class="btn btn-light border" onclick="SLCApp.demoActionModal('Report generated successfully in prototype mode.')"><i class="bi bi-arrow-repeat"></i>Generate</button>
      <button class="btn btn-light border" onclick="SLCApp.toast('Report exported to PDF in prototype mode.')"><i class="bi bi-file-earmark-pdf"></i>Export to PDF</button>
      <button class="btn btn-light border" onclick="SLCApp.toast('Report exported to Excel in prototype mode.')"><i class="bi bi-file-earmark-excel"></i>Export to Excel</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-xl-7">
      <div class="section-card h-100">
        <div class="sc-header"><span id="chartTitle1">Overview</span></div>
        <div class="sc-body"><div class="chart-box" style="height:340px;"><canvas id="chartPrimary"></canvas></div></div>
      </div>
    </div>
    <div class="col-xl-5">
      <div class="section-card h-100" id="secondaryChartCard" style="display:none;">
        <div class="sc-header"><span id="chartTitle2">Detail</span></div>
        <div class="sc-body"><div class="chart-box" style="height:340px;"><canvas id="chartSecondary"></canvas></div></div>
      </div>
      <div class="section-card" id="notesCard">
        <div class="sc-header"><span>Report Narrative</span></div>
        <div class="sc-body" id="rptNarrative" style="font-size:12.8px;color:var(--slc-text);"></div>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="sc-header">
      <span>Data Breakdown</span>
      <span class="text-muted-soft" id="tableSubtitle" style="font-size:11.5px;font-weight:500;"></span>
    </div>
    <div class="table-scroll">
      <table class="table-modern mb-0" id="rptTable">
        <thead><tr id="rptTableHead"></tr></thead>
        <tbody id="rptTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/report-details.js"></script>
</body>
</html>
