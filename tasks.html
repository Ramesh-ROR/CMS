<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem("slc_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — SLC Case Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
<style>
  /* Urgency flag badges (BRD 6.1.1 — deadline-proximity flags, distinct from workflow Status) */
  .flag-not-urgent { background: #F3F4F6; color:var(--slc-muted); }
  .flag-becoming-urgent { background: #FEF9C3; color: #A16207; }
  .flag-urgent { background: #FFE8D1; color: #C2540A; }
  .flag-critical { background: #FEE2E2; color: #B91C1C; }
  .flag-overdue { background: #1F2937; color: #F9FAFB; }
  .flag-overdue::before { background: #F9FAFB; }
  .flag-none { background: #F3F4F6; color:var(--slc-muted); }
  .flag-none::before { display: none; }

  .kanban-col-head .count-pill { background: #fff; border: 1px solid var(--slc-border); color:var(--slc-muted); font-size: 11px; font-weight: 700; padding: 1px 9px; border-radius: 20px; }
  .kanban-col-head .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .kanban-col.col-new .kanban-col-head .dot { background: #2563EB; }
  .kanban-col.col-inprogress .kanban-col-head .dot { background: #D97706; }
  .kanban-col.col-completed .kanban-col-head .dot { background: #16A34A; }
  .kanban-col.col-overdue .kanban-col-head .dot { background: #1F2937; }

  .task-filter-tabs .btn { font-size: 12.6px; }
  .task-filter-tabs .btn.active { background: var(--slc-primary); border-color: var(--slc-primary); color: #fff; }

  .empty-state { padding: 46px 20px; text-align: center; color: var(--slc-muted); }
  .empty-state i { font-size: 34px; color: #C7D2E0; display: block; margin-bottom: 10px; }
  .empty-state .es-title { font-weight: 700; color: var(--slc-text); font-size: 14px; margin-bottom: 4px; }
  .empty-state .es-sub { font-size: 12.5px; }

  .k-case-link { display: inline-block; margin-bottom: 4px; }

  [data-theme="dark"] .flag-not-urgent,
  [data-theme="dark"] .flag-none { background: rgba(255,255,255,.08); }
  [data-theme="dark"] .flag-becoming-urgent { background: rgba(161,98,7,.24); color: #FDE68A; }
  [data-theme="dark"] .flag-urgent { background: rgba(194,84,10,.24); color: #FDBA74; }
  [data-theme="dark"] .flag-critical { background: rgba(185,28,28,.26); color: #FCA5A5; }
  [data-theme="dark"] .flag-overdue { background: #000; border: 1px solid var(--slc-border); }
  [data-theme="dark"] .kanban-col-head .count-pill { background: var(--slc-card); }
  [data-theme="dark"] .empty-state i { color: #45566F; }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Tasks" data-ar="المهام">Tasks</h1>
      <div class="page-subtitle">Assign, track and follow up on tasks linked to your cases and activities.</div>
    </div>
    <div class="page-title-actions">
      <button class="btn btn-light border" id="btnAssignTask"><i class="bi bi-person-check"></i>Assign Task</button>
      <button class="btn btn-primary" id="btnAddTask"><i class="bi bi-plus-lg"></i>Add Task</button>
    </div>
  </div>

  <div id="aiInsightSlot"></div>

  <!-- Kanban summary board -->
  <div class="section-card">
    <div class="sc-header">
      <span>Task Board</span>
      <span class="text-muted-soft" style="font-size:11.5px;font-weight:500;">All tasks grouped by status</span>
    </div>
    <div class="sc-body">
      <div class="row g-3" id="kanbanRow"></div>
    </div>
  </div>

  <!-- Filter tabs -->
  <div class="filter-bar d-flex align-items-center gap-3 flex-wrap">
    <div class="btn-group task-filter-tabs" id="taskFilterTabs" role="group"></div>
    <div class="ms-auto text-muted-soft" id="taskCountLabel" style="font-size:12.3px;"></div>
  </div>

  <!-- Detailed table -->
  <div class="table-card">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="tasksTable">
        <thead>
          <tr>
            <th>Task</th>
            <th>Related Case</th>
            <th>Assignee</th>
            <th>Assigned By</th>
            <th>Priority</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Urgency</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="empty-state" id="tasksEmptyState" style="display:none;"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
