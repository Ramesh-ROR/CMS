<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem("slc_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders — SLC Case Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
<style>
  .date-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; }
  .date-chip {
    flex: 0 0 auto; min-width: 92px; background: #fff; border: 1px solid var(--slc-border); border-radius: 12px;
    padding: 10px 14px; text-align: center; cursor: pointer; transition: border-color .15s, box-shadow .15s;
  }
  .date-chip:hover { border-color: #BFE0F7; box-shadow: var(--slc-shadow-sm); }
  .date-chip.active { border-color: var(--slc-primary); background: #EAF3FC; box-shadow: 0 0 0 2px rgba(0,120,212,.12); }
  .date-chip .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--slc-muted); font-weight: 700; }
  .date-chip .dnum { font-size: 20px; font-weight: 800; color: var(--slc-text); line-height: 1.3; }
  .date-chip .dcount { font-size: 10.5px; font-weight: 700; margin-top: 4px; }
  .date-chip.is-today { border-color: var(--slc-primary); }
  .date-chip.is-today .dow { color: var(--slc-primary); }

  .type-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color:var(--slc-muted); }
  .type-pill i { color: var(--slc-primary); }

  [data-theme="dark"] .date-chip { background: var(--slc-card); }
  [data-theme="dark"] .date-chip:hover { border-color: rgba(59,158,245,.4); }
  [data-theme="dark"] .date-chip.active { background: rgba(59,158,245,.14); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Reminders" data-ar="التذكيرات">Reminders</h1>
      <div class="page-subtitle">Reminders tied to case activities, tasks and Proposed Completion Dates (PCD).</div>
    </div>
    <div class="page-title-actions">
      <button class="btn btn-primary" id="btnAddReminder"><i class="bi bi-plus-lg"></i>Set Reminder</button>
    </div>
  </div>

  <div id="aiInsightSlot"></div>

  <!-- Grouped-by-date strip (lightweight calendar density view) -->
  <div class="section-card">
    <div class="sc-header">
      <span>Reminders by Date</span>
      <span class="text-muted-soft" style="font-size:11.5px;font-weight:500;">Click a date to filter the list below</span>
    </div>
    <div class="sc-body pt-2">
      <div class="date-strip" id="dateStrip"></div>
    </div>
  </div>

  <div class="filter-bar d-flex align-items-center gap-3 flex-wrap">
    <div class="text-muted-soft" id="reminderCountLabel" style="font-size:12.3px;"></div>
    <button class="btn btn-sm btn-light border ms-auto" id="btnClearDateFilter" style="display:none;"><i class="bi bi-x-lg"></i>Clear date filter</button>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="remindersTable">
        <thead>
          <tr>
            <th>Reminder</th>
            <th>Related Case</th>
            <th>Reminder Date</th>
            <th>Assigned To</th>
            <th>Type</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/reminders.js"></script>
</body>
</html>
