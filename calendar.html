<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — SLC Case Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav .btn { width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .cal-month-label { font-size: 15.5px; font-weight: 700; min-width: 170px; text-align: center; }

  .cal-legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12px; color:var(--slc-muted); }
  .cal-legend .item { display: flex; align-items: center; gap: 6px; }
  .cal-legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .cal-legend .dot.pcd { background: #8A6A3A; }
  .cal-legend .dot.task { background: #F08C1A; }
  .cal-legend .dot.reminder { background: #8764B8; }

  .cal-weekhead { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 8px; }
  .cal-weekhead .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--slc-muted); text-transform: uppercase; letter-spacing: .04em; padding: 4px 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-cell {
    min-height: 108px; background: #fff; border: 1px solid var(--slc-border); border-radius: 10px;
    padding: 8px; cursor: pointer; transition: border-color .15s, box-shadow .15s; display: flex; flex-direction: column;
  }
  .cal-cell:hover { border-color: #E3CFA0; box-shadow: var(--slc-shadow-sm); }
  .cal-cell.other-month { background: #FAFBFD; }
  .cal-cell.other-month .cal-daynum { color: #C7D2E0; }
  .cal-cell.today { border-color: var(--slc-primary); box-shadow: 0 0 0 2px rgba(107,79,36,.14); }
  .cal-daynum { font-size: 12.5px; font-weight: 700; color: var(--slc-text); margin-bottom: 6px; }
  .cal-cell.today .cal-daynum {
    background: var(--slc-primary); color: #fff; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px;
  }
  .cal-chips { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .cal-chip {
    font-size: 10.3px; font-weight: 600; padding: 2px 6px; border-radius: 5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent;
  }
  .cal-chip-pcd { background: #F5EBD8; color: #6B4F24; border-left-color: #8A6A3A; }
  .cal-chip-task { background: #FFF1E0; color: #C2540A; border-left-color: #F08C1A; }
  .cal-chip-reminder { background: #F1E9FE; color: #6B3FA0; border-left-color: #8764B8; }
  .cal-more { font-size: 10px; color: var(--slc-muted); font-weight: 600; padding: 1px 6px; }

  .dd-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F1F3F6; }
  .dd-item:last-child { border-bottom: none; }
  .dd-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .dd-icon.pcd { background: #F5EBD8; color: #8A6A3A; }
  .dd-icon.task { background: #FFF1E0; color: #F08C1A; }
  .dd-icon.reminder { background: #F1E9FE; color: #8764B8; }
  .dd-title { font-size: 13px; font-weight: 700; color: var(--slc-text); }
  .dd-sub { font-size: 11.5px; color: var(--slc-muted); margin-top: 2px; }

  [data-theme="dark"] .cal-legend { color: var(--slc-muted); }
  [data-theme="dark"] .cal-cell { background: var(--slc-card); }
  [data-theme="dark"] .cal-cell:hover { border-color: rgba(217,184,118,.4); }
  [data-theme="dark"] .cal-cell.other-month { background: rgba(255,255,255,.02); }
  [data-theme="dark"] .cal-cell.other-month .cal-daynum { color: #45566F; }
  [data-theme="dark"] .cal-chip-pcd { background: rgba(217,184,118,.16); color: #E8CB94; border-left-color: #D9B876; }
  [data-theme="dark"] .cal-chip-task { background: rgba(240,140,26,.18); color: #FDBA74; border-left-color: #F08C1A; }
  [data-theme="dark"] .cal-chip-reminder { background: rgba(135,100,184,.22); color: #D8B4FE; border-left-color: #8764B8; }
  [data-theme="dark"] .dd-item { border-bottom-color: var(--slc-border); }
  [data-theme="dark"] .dd-icon.pcd { background: rgba(217,184,118,.16); color: #E8CB94; }
  [data-theme="dark"] .dd-icon.task { background: rgba(240,140,26,.18); color: #FDBA74; }
  [data-theme="dark"] .dd-icon.reminder { background: rgba(135,100,184,.22); color: #D8B4FE; }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Calendar" data-ar="التقويم">Calendar</h1>
      <div class="page-subtitle">Case Proposed Completion Dates, task deadlines and reminders for your cases.</div>
    </div>
    <div class="page-title-actions cal-nav">
      <button class="btn btn-light border" id="btnToday" style="width:auto;padding:0 14px;">Today</button>
      <button class="btn btn-light border" id="btnPrevMonth"><i class="bi bi-chevron-left"></i></button>
      <div class="cal-month-label" id="monthLabel"></div>
      <button class="btn btn-light border" id="btnNextMonth"><i class="bi bi-chevron-right"></i></button>
    </div>
  </div>

  <div id="aiInsightSlot"></div>

  <div class="section-card">
    <div class="sc-header">
      <span>Month View</span>
      <div class="cal-legend">
        <span class="item"><span class="dot pcd"></span>Case PCD</span>
        <span class="item"><span class="dot task"></span>Task Deadline</span>
        <span class="item"><span class="dot reminder"></span>Reminder</span>
      </div>
    </div>
    <div class="sc-body">
      <div class="cal-weekhead">
        <div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div><div class="wd">Wed</div>
        <div class="wd">Thu</div><div class="wd">Fri</div><div class="wd">Sat</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

</div>

<!-- Day detail modal -->
<div class="modal fade" id="dayDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header" style="border-bottom:1px solid var(--slc-border);">
        <h6 class="modal-title fw-bold mb-0" id="dayDetailTitle">Date</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="dayDetailBody" style="max-height:60vh;overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
