<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Workspace — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
</head>
<body>
<div id="__pageBody">

  <!-- Case header -->
  <div class="section-card">
    <div class="sc-body" id="caseHeaderBox">
      <div class="d-flex justify-content-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>

  <!-- Workflow stepper -->
  <div class="section-card">
    <div class="sc-header" style="cursor:pointer;" id="wsWorkflowToggle">
      <span>Workflow Progress</span>
      <span class="text-primary" style="font-size:12.3px;font-weight:600;" id="wsWorkflowToggleLabel">Show Details<i class="bi bi-chevron-down ms-1"></i></span>
    </div>
    <div class="collapse" id="wsWorkflowBody">
      <div class="sc-body">
        <div class="workflow-stepper" id="wsWorkflow"></div>
      </div>
    </div>
  </div>

  <!-- Tab navigation -->
  <div class="tab-nav" id="cwTabs">
    <button type="button" class="tab-btn active" data-tab="tabGeneral">General</button>
    <button type="button" class="tab-btn" data-tab="tabActivities">Activities</button>
    <button type="button" class="tab-btn" data-tab="tabAttachments">Attachments</button>
    <button type="button" class="tab-btn" data-tab="tabCaseTeam">Case Team</button>
  </div>

  <div class="tab-panels" id="cwPanels">

    <!-- General -->
    <div class="tab-panel active" id="tabGeneral">
      <div id="generalDetailsBody"></div>
    </div>

    <!-- Activities -->
    <div class="tab-panel" id="tabActivities">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="ws-meta" id="activityCount" style="font-size:12px;color:var(--slc-muted);"></span>
        <button class="btn btn-sm btn-primary" onclick="SLCApp.demoActionModal('Activity added successfully in prototype mode.')"><i class="bi bi-plus-lg"></i>Add Activity</button>
      </div>
      <div class="table-scroll">
        <table class="table-modern mb-0" id="activityTable">
          <thead>
            <tr>
              <th>Type</th>
              <th>Activity</th>
              <th>Description</th>
              <th>Entered By</th>
              <th>Date &amp; Time</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="activityTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Attachments -->
    <div class="tab-panel" id="tabAttachments">
      <div class="dropzone" onclick="SLCApp.demoActionModal('Document uploaded successfully in prototype mode.')">
        <i class="bi bi-cloud-arrow-up"></i>
        <div style="font-weight:600;font-size:13px;color:var(--slc-text);">Drag &amp; drop documents here, or click to browse</div>
        <div style="font-size:11.5px;">Upload Document — or select from Document Bank</div>
      </div>
      <div id="attachmentsBody"></div>
    </div>

    <!-- Case Team -->
    <div class="tab-panel" id="tabCaseTeam">
      <div id="teamBody"></div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/case-workspace.js"></script>
</body>
</html>
